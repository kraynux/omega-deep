[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-deep"
version = "1.5.0"
description = "Analyse d'architecture multi-cibles (decouverte + garde-fous), omega-deep"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "omega-lib>=0.1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpserver>=1.0",
    "trustme>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[project.scripts]
omega-deep = "omega_deep.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_deep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# Controle d'imports entre couches (voir OMEGA-DEEP_ARBORESCENCE.md §1 et
# ~/DEV/SUITE/DECISIONS_ARCHITECTURE.md D-000/D-007) : contrats copies
# verbatim depuis omega-check/pyproject.toml, seuls les chemins de
# confinement par technologie sont adaptes a l'arborescence de DEEP.
[tool.importlinter]
root_package = "omega_deep"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# Ordre du plus exterieur (haut, autorise a importer tout ce qui suit) au
# plus interieur (bas, n'importe rien de la liste) :
#   app                                     -- racine de composition
#   infrastructure | interfaces | plugins   -- adaptateurs, independants entre eux
#   application                             -- cas d'usage
#   ports                                   -- contrats
#   domain                                  -- metier pur
#   core                                    -- vocabulaire transverse
name = "Dependency Rule : les couches externes dependent des internes, jamais l'inverse"
type = "layers"
layers = [
    "omega_deep.app",
    "omega_deep.infrastructure | omega_deep.interfaces | omega_deep.plugins",
    "omega_deep.application",
    "omega_deep.ports",
    "omega_deep.domain",
    "omega_deep.core",
]

[[tool.importlinter.contracts]]
name = "interfaces ne dependent jamais directement de infrastructure"
type = "independence"
modules = [
    "omega_deep.interfaces",
    "omega_deep.infrastructure",
]

[[tool.importlinter.contracts]]
# Ajoutable des maintenant (Phase 2) : infrastructure/network/ existe et
# importe reellement httpx. Contrairement au contrat "textual" (qui
# reference omega_deep.interfaces.cli, sous-module encore inexistant),
# celui-ci ne liste que des paquets top-niveau deja crees.
name = "httpx seulement dans infrastructure.network"
type = "forbidden"
source_modules = [
    "omega_deep.core",
    "omega_deep.domain",
    "omega_deep.application",
    "omega_deep.ports",
    "omega_deep.interfaces",
    "omega_deep.plugins",
    "omega_deep.shared",
]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
# app/ est volontairement absente de source_modules : c'est la racine de
# composition (app/dependency_container.py doit pouvoir construire un
# SqliteScanRepository) — verifie au niveau du module qui importe sqlite3
# lui-meme, pas de tout module qui construit une instance qui l'importe.
name = "sqlite3 seulement dans infrastructure.storage.sqlite"
type = "forbidden"
source_modules = [
    "omega_deep.core",
    "omega_deep.domain",
    "omega_deep.application",
    "omega_deep.ports",
    "omega_deep.interfaces",
    "omega_deep.plugins",
    "omega_deep.shared",
]
forbidden_modules = ["sqlite3"]

[[tool.importlinter.contracts]]
name = "jinja2 seulement dans infrastructure.exporters.html_exporter"
type = "forbidden"
source_modules = [
    "omega_deep.core",
    "omega_deep.domain",
    "omega_deep.application",
    "omega_deep.ports",
    "omega_deep.interfaces",
    "omega_deep.plugins",
    "omega_deep.shared",
    "omega_deep.infrastructure.config",
    "omega_deep.infrastructure.exceptions",
    "omega_deep.infrastructure.logging",
    "omega_deep.infrastructure.network",
    "omega_deep.infrastructure.discovery",
    "omega_deep.infrastructure.storage",
    "omega_deep.infrastructure.exporters.json_exporter",
    "omega_deep.infrastructure.exporters.text_exporter",
]
forbidden_modules = ["jinja2"]

[[tool.importlinter.contracts]]
name = "textual seulement dans interfaces.tui"
type = "forbidden"
source_modules = [
    "omega_deep.core",
    "omega_deep.domain",
    "omega_deep.application",
    "omega_deep.ports",
    "omega_deep.infrastructure",
    "omega_deep.plugins",
    "omega_deep.shared",
    "omega_deep.app",
    "omega_deep.interfaces.cli",
]
forbidden_modules = ["textual"]
